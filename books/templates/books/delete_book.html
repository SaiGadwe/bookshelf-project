{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Book - BookShelf</title>
    <link rel="stylesheet" href="{% static 'books/style.css' %}">
</head>
<body>
    {% include 'books/navbar.html' %}
    <h1>🗑️ Delete "{{ book.title }}"?</h1>
    <p>Are you sure you want to delete this book? This cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete it</button>
    </form>
</body>
</html>
