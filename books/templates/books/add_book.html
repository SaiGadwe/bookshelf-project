{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book - BookShelf</title>
    <link rel="stylesheet" href="{% static 'books/style.css' %}">
</head>
<body>
    <h1>📚 Add a New Book</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Book</button>
    </form>

    <p><a href="{% url 'book_list' %}">Back to book list</a></p>
</body>
</html>
